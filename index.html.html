
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>קופון חיבוק לשקד</title>
    <style>
        body {
            background: pink;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding-top: 100px;
            overflow: hidden;
            animation: glitter 1s infinite alternate;
        }
        h1 {
            font-size: 3em;
            text-shadow: 0 0 10px white, 0 0 20px hotpink, 0 0 30px deeppink;
        }
        button {
            background: deeppink;
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 2em;
            border-radius: 40px;
            box-shadow: 0 0 20px white;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px white;
        }
        @keyframes glitter {
            from { background-color: pink; }
            to { background-color: hotpink; }
        }
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: red;
            transform: rotate(-45deg);
            animation: float 4s linear infinite;
        }
        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background: red;
            border-radius: 50%;
        }
        .heart::before {
            top: -10px;
            left: 0;
        }
        .heart::after {
            left: 10px;
            top: 0;
        }
        @keyframes float {
            0% {
                bottom: -10%;
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                bottom: 110%;
                opacity: 0;
            }
        }
        #coupon {
            margin-top: 50px;
            font-size: 2em;
            color: white;
            background: rgba(255, 105, 180, 0.8);
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 0 15px white;
            display: none;
        }
    </style>
</head>
<body>
    <h1>תלחצי עליי</h1>
    <button onclick="showCoupon()">לחצי כאן</button>
    <div id="coupon">קופון לחיבוק חם מסאי!</div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (2 + Math.random() * 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
        setInterval(createHeart, 300);

        function showCoupon() {
            document.getElementById("coupon").style.display = "block";
        }
    </script>
</body>
</html>
